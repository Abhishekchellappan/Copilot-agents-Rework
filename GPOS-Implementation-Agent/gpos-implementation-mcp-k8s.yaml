apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpos-muralidhar-impl
  namespace: ai-user2
  labels:
    app: gpos-muralidhar-impl
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpos-muralidhar-impl
  template:
    metadata:
      labels:
        app: gpos-muralidhar-impl
        component: mcp-server
    spec:
      containers:
        - name: impl-mcp
          image: abhishek15c/gpos-implementation-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: sse-port
              protocol: TCP
          env:
            - name: WORKSPACE_ROOT
              value: "/app/workspace"
            - name: SERVER_PORT
              value: "8000"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gpos-muralidhar-impl-service
  namespace: ai-user2
  labels:
    app: gpos-muralidhar-impl
    component: mcp-server
spec:
  type: NodePort
  selector:
    app: gpos-muralidhar-impl
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 31714
