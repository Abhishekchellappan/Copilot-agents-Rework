apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gpos-ax-portal-pvc-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpos-ax-portal-dev
  labels:
    app: gpos-ax-portal-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpos-ax-portal-dev
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gpos-ax-portal-dev
    spec:
      containers:
      - name: portal
        image: abhishek15c/gpos-ax-portal:dev
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http-port
        env:
        - name: MCP_SERVER_URL
          value: "http://gpos-muralidhar-jira-service:8000"
        - name: DEVICE_MCP_SERVER_URL
          value: "http://gpos-muralidhar-device-service:8000"
        - name: JIRA_BASE_URL
          value: "http://jira.lge.com/issue"
        - name: DB_PATH
          value: "/app/data/gpos_portal.db"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: gpos-ax-portal-pvc-dev
---
apiVersion: v1
kind: Service
metadata:
  name: gpos-ax-portal-service-dev
spec:
  type: NodePort
  selector:
    app: gpos-ax-portal-dev
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 