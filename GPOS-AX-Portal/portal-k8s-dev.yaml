apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gpos-ax-portal-pvc-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpos-ax-portal-dev
  labels:
    app: gpos-ax-portal-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpos-ax-portal-dev
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gpos-ax-portal-dev
    spec:
      containers:
      - name: portal
        image: abhishek15c/gpos-ax-portal:dev
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http-port
        env:
        - name: MCP_SERVER_URL
          value: "http://gpos-muralidhar-jira-service:8000"
        - name: DEVICE_MCP_SERVER_URL
          value: "http://gpos-muralidhar-device-service-dev:8000"
        - name: JIRA_BASE_URL
          value: "http://jira.lge.com/issue"
        - name: DB_PATH
          value: "/app/data/gpos_portal.db"
        # Automated Bug Triage Watchdog — platform infrastructure secrets
        - name: BUG_WATCHDOG_JIRA_PAT
          valueFrom:
            secretKeyRef:
              name: gpos-bug-watchdog-secret
              key: jira-pat
              optional: true
        - name: BUG_WATCHDOG_LLM_KEY
          valueFrom:
            secretKeyRef:
              name: gpos-bug-watchdog-secret
              key: llm-key
              optional: true
        - name: SMTP_HOST
          value: ""
        - name: SMTP_PORT
          value: "25"
        - name: SMTP_FROM
          value: "gpos-ax-portal@lge.com"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: ssh-key-volume
          mountPath: /root/.ssh
          readOnly: true
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: gpos-ax-portal-pvc-dev
      - name: ssh-key-volume
        secret:
          secretName: gpos-device-agent-ssh-key
          defaultMode: 0400
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: gpos-ax-portal-service-dev
spec:
  type: NodePort
  selector:
    app: gpos-ax-portal-dev
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 