apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gpos-ax-portal-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpos-ax-portal
  labels:
    app: gpos-ax-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpos-ax-portal
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gpos-ax-portal
    spec:
      containers:
      - name: portal
        image: abhishek15c/gpos-ax-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http-port
        env:
        - name: MCP_SERVER_URL
          value: "http://gpos-muralidhar-jira-service:8000"
        - name: DEVICE_MCP_SERVER_URL
          value: "http://gpos-muralidhar-device-service:8000"
        - name: JIRA_BASE_URL
          value: "http://jira.lge.com/issue"
        - name: DB_PATH
          value: "/app/data/gpos_portal.db"
        # Automated Bug Triage Watchdog — disabled by default, opt-in only
        - name: BUG_WATCHDOG_ENABLED
          value: "false"
        - name: BUG_WATCHDOG_PROJECT_KEY
          value: "SIGPOSDEV"
        - name: BUG_WATCHDOG_USERS
          value: ""
        - name: BUG_WATCHDOG_JIRA_PAT
          valueFrom:
            secretKeyRef:
              name: gpos-bug-watchdog-secret
              key: jira-pat
              optional: true
        - name: BUG_WATCHDOG_LLM_KEY
          valueFrom:
            secretKeyRef:
              name: gpos-bug-watchdog-secret
              key: llm-key
              optional: true
        - name: SMTP_HOST
          value: ""
        - name: SMTP_PORT
          value: "25"
        - name: SMTP_FROM
          value: "gpos-ax-portal@lge.com"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: gpos-ax-portal-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gpos-ax-portal-service
spec:
  type: NodePort
  selector:
    app: gpos-ax-portal
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30662