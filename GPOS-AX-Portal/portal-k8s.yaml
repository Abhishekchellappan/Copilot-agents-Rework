apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpos-ax-portal
  labels:
    app: gpos-ax-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpos-ax-portal
  template:
    metadata:
      labels:
        app: gpos-ax-portal
    spec:
      containers:
      - name: portal
        image: abhishek15c/gpos-ax-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http-port
        env:
        - name: MCP_SERVER_URL
          value: "http://gpos-muralidhar-jira-service:8000"
        - name: JIRA_BASE_URL
          value: "http://jira.lge.com/issue"
---
apiVersion: v1
kind: Service
metadata:
  name: gpos-ax-portal-service
spec:
  type: NodePort
  selector:
    app: gpos-ax-portal
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30010
